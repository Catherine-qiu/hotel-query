function loadHotels() {
  const city = document.getElementById('city').value;
  const hotelSelect = document.getElementById('hotel');
  const result = document.getElementById('result');
  hotelSelect.innerHTML = '<option value="">— 请选择住宿 —</option>';
  result.className = 'result empty';
  result.textContent = '请选择住宿名称';
  if (!city) {
    hotelSelect.disabled = true;
    hotelSelect.innerHTML = '<option value="">— 请先选择出发地 —</option>';
    return;
  }
  hotelSelect.disabled = false;
  data[city].forEach((h, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = h.name;
    hotelSelect.appendChild(opt);
  });
}

function showDetail() {
  const city = document.getElementById('city').value;
  const idx = document.getElementById('hotel').value;
  const result = document.getElementById('result');
  if (idx === '' || !city) {
    result.className = 'result empty';
    result.textContent = '请选择住宿名称';
    return;
  }
  const h = data[city][idx];
  result.className = 'result';
  result.innerHTML = `
    <div class="hotel-name">${h.name}</div>
    <div class="hotel-detail">
      <span>${h.type}</span>
      <span>驾车 ${h.dist} km</span>
    </div>
    <div class="address-line"><strong>地址：</strong>${h.address}</div>
  `;
}
</script>
